<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t">
  <title id="t">Traits and debuffs - hand-inked</title>
  <defs>
    <style>
      <![CDATA[
        .paper { fill: #f2efe8; }
        .panel { fill: #f7f5f0; }
        .ink { fill: none; stroke: #2a2a2a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .ink-soft { fill: none; stroke: #4a4a4a; stroke-width: 1.1; stroke-linecap: round; }
        .title { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 15px; font-weight: bold; }
        .muted { font-family: "Courier New", Courier, monospace; fill: #5a5a5a; font-size: 11px; }
        .body { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 12px; }
        .note { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 11px; }
        .tag { fill: #ebe7df; stroke: #2a2a2a; stroke-width: 1.2; }
      ]]>
    </style>
  </defs>

  <!-- card fill -->
  <rect class="paper" x="8" y="8" width="704" height="324" rx="4"/>

  <!-- fixed frame: bottom edge locked at y=324 (content must end above y=300) -->
  <rect class="ink" x="12" y="12" width="696" height="312" rx="3"/>

  <text class="title" x="360" y="40" text-anchor="middle">TRAITS &amp; DEBUFFS</text>
  <path class="ink-soft" d="M240 48 Q 360 54 480 48"/>
  <text class="muted" x="360" y="66" text-anchor="middle">field notes  //  always on</text>

  <!--
    Rows: start y=84, each row h=44, gap=10
    row0: 84..128
    row1: 138..182
    row2: 192..236
    row3: 246..290
    frame bottom: 324, safe gap: 34px
  -->
  <g transform="translate(40, 84)">
    <g>
      <rect class="panel" x="0" y="0" width="640" height="44"/>
      <rect class="ink-soft" x="0" y="0" width="640" height="44"/>
      <rect class="tag" x="12" y="11" width="150" height="22" rx="3"/>
      <text class="body" x="87" y="26" text-anchor="middle">Perfectionism</text>
      <text class="note" x="178" y="26">"Almost done" can last a week</text>
    </g>

    <g transform="translate(0, 54)">
      <rect class="panel" x="0" y="0" width="640" height="44"/>
      <rect class="ink-soft" x="0" y="0" width="640" height="44"/>
      <rect class="tag" x="12" y="11" width="150" height="22" rx="3"/>
      <text class="body" x="87" y="26" text-anchor="middle">Naming curse</text>
      <text class="note" x="178" y="26">Owns final, final2, final_really</text>
    </g>

    <g transform="translate(0, 108)">
      <rect class="panel" x="0" y="0" width="640" height="44"/>
      <rect class="ink-soft" x="0" y="0" width="640" height="44"/>
      <rect class="tag" x="12" y="11" width="150" height="22" rx="3"/>
      <text class="body" x="87" y="26" text-anchor="middle">Tab diplomacy</text>
      <text class="note" x="178" y="26">Refuses to start wars. Loses them quietly.</text>
    </g>

    <g transform="translate(0, 162)">
      <rect class="panel" x="0" y="0" width="640" height="44"/>
      <rect class="ink-soft" x="0" y="0" width="640" height="44"/>
      <rect class="tag" x="12" y="11" width="150" height="22" rx="3"/>
      <text class="body" x="87" y="26" text-anchor="middle">Hidden passive</text>
      <text class="note" x="178" y="26">Stuck? Walk. Solutions appear mid-block.</text>
    </g>
  </g>
</svg>
