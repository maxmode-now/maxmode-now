<svg xmlns="http://www.w3.org/2000/svg" width="920" height="64" viewBox="0 0 920 64" role="img" aria-labelledby="t">
  <title id="t">typing tagline</title>
  <defs>
    <style>
      <![CDATA[
        .paper { fill: #f2efe8; }
        .ink { fill: none; stroke: #2a2a2a; stroke-width: 1.4; stroke-linecap: round; }
        .txt { font-family: "Courier New", Courier, monospace; fill: #1f1f1f; font-size: 16px; }
        .muted { fill: #5a5a5a; }
        #a { opacity: 0; animation: s 9s ease-in-out infinite; }
        #b { opacity: 0; animation: s 9s ease-in-out infinite; animation-delay: 3s; }
        #c { opacity: 0; animation: s 9s ease-in-out infinite; animation-delay: 6s; }
        #cur { animation: blink 1s steps(1,end) infinite; }
        @keyframes s {
          0%, 5% { opacity: 0; }
          12%, 28% { opacity: 1; }
          35%, 100% { opacity: 0; }
        }
        @keyframes blink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
      ]]>
    </style>
  </defs>
  <rect class="paper" x="8" y="8" width="904" height="48" rx="4"/>
  <path class="ink" d="M10 12 C 20 8, 900 8, 910 14 C 914 30, 912 50, 904 54 C 880 58, 40 58, 14 52 C 6 40, 6 24, 10 12 Z" fill="none"/>
  <text class="txt muted" x="28" y="38">$</text>
  <text id="a" class="txt" x="48" y="38">builds interfaces with graphite and grit_</text>
  <text id="b" class="txt" x="48" y="38">debugs reality one commit at a time_</text>
  <text id="c" class="txt" x="48" y="38">open for quests, closed for meetings_</text>
  <rect id="cur" x="872" y="24" width="9" height="16" fill="#1f1f1f"/>
</svg>
