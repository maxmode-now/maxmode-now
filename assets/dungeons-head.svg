<svg xmlns="http://www.w3.org/2000/svg" width="780" height="76" viewBox="0 0 780 76" role="img" aria-label="Dungeons cleared header">
  <defs>
    <style>
      <![CDATA[
        .paper { fill: #f2efe8; }
        .ink { fill: none; stroke: #2a2a2a; stroke-width: 1.5; stroke-linecap: round; }
        .ink-soft { fill: none; stroke: #4a4a4a; stroke-width: 1.1; }
        .title { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 15px; font-weight: bold; }
        .muted { font-family: "Courier New", Courier, monospace; fill: #5a5a5a; font-size: 11px; }
      ]]>
    </style>
  </defs>
  <!-- full-bleed so no dark gaps between stacked images -->
  <rect class="paper" width="780" height="76"/>
  <path class="ink" d="M12 12 H768"/>
  <path class="ink" d="M12 12 V76 M768 12 V76"/>
  <text class="title" x="390" y="36" text-anchor="middle">DUNGEONS CLEARED</text>
  <path class="ink-soft" d="M250 44 Q 390 50 530 44"/>
  <text class="muted" x="390" y="64" text-anchor="middle">loot log  //  click a row to enter</text>
</svg>
