<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="t">
  <title id="t">Dungeons cleared - hand-inked</title>
  <defs>
    <style>
      <![CDATA[
        .paper { fill: #f2efe8; }
        .panel { fill: #f7f5f0; }
        .ink { fill: none; stroke: #2a2a2a; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
        .ink-soft { fill: none; stroke: #4a4a4a; stroke-width: 1.1; stroke-linecap: round; }
        .ink-light { fill: none; stroke: #6e6e6e; stroke-width: 0.9; stroke-linecap: round; }
        .title { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 15px; font-weight: bold; }
        .muted { font-family: "Courier New", Courier, monospace; fill: #5a5a5a; font-size: 11px; }
        .head { font-family: "Courier New", Courier, monospace; fill: #5a5a5a; font-size: 11px; }
        .body { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 12px; }
        .fill { fill: #2a2a2a; stroke: none; }
        .empty { fill: none; stroke: #2a2a2a; stroke-width: 1.2; }
      ]]>
    </style>
  </defs>

  <rect class="paper" x="6" y="6" width="768" height="288" rx="4"/>
  <path class="ink" d="M10 14 C 40 6, 740 6, 770 16 C 778 50, 776 260, 768 286 C 730 296, 50 296, 14 282 C 4 240, 4 50, 10 14 Z" fill="none"/>

  <text class="title" x="390" y="38" text-anchor="middle">DUNGEONS CLEARED</text>
  <path class="ink-soft" d="M250 46 Q 390 52 530 46"/>
  <text class="muted" x="390" y="64" text-anchor="middle">loot log  //  doors below</text>

  <!-- column headers -->
  <g transform="translate(36, 82)">
    <text class="head" x="8" y="0">DUNGEON</text>
    <text class="head" x="360" y="0">RANK</text>
    <text class="head" x="460" y="0">LOOT</text>
    <text class="head" x="650" y="0">DOOR</text>
    <path class="ink-light" d="M0 8 H708" opacity="0.45"/>

    <!-- row 1 -->
    <g transform="translate(0, 20)">
      <path class="panel" d="M0 0 H708 V48 H0 Z"/>
      <path class="ink-soft" d="M0 0 H708 V48 H0 Z" fill="none"/>
      <text class="body" x="12" y="30">spring-config-drift-inspector</text>
      <!-- rank 4/4 -->
      <rect class="fill" x="360" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="378" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="396" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="414" y="17" width="14" height="14" rx="2"/>
      <text class="body" x="460" y="30">Config ghosts, exorcised</text>
      <text class="muted" x="650" y="30">enter -&gt;</text>
    </g>

    <!-- row 2 -->
    <g transform="translate(0, 76)">
      <path class="panel" d="M0 0 H708 V48 H0 Z"/>
      <path class="ink-soft" d="M0 0 H708 V48 H0 Z" fill="none"/>
      <text class="body" x="12" y="30">token-tray</text>
      <!-- rank 3/4 -->
      <rect class="fill" x="360" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="378" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="396" y="17" width="14" height="14" rx="2"/>
      <rect class="empty" x="414" y="17" width="14" height="14" rx="2"/>
      <text class="body" x="460" y="30">Tokens that stay put</text>
      <text class="muted" x="650" y="30">enter -&gt;</text>
    </g>

    <!-- row 3 -->
    <g transform="translate(0, 132)">
      <path class="panel" d="M0 0 H708 V48 H0 Z"/>
      <path class="ink-soft" d="M0 0 H708 V48 H0 Z" fill="none"/>
      <text class="body" x="12" y="30">city-3d</text>
      <!-- rank 4/4 -->
      <rect class="fill" x="360" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="378" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="396" y="17" width="14" height="14" rx="2"/>
      <rect class="fill" x="414" y="17" width="14" height="14" rx="2"/>
      <text class="body" x="460" y="30">A city you can orbit</text>
      <text class="muted" x="650" y="30">enter -&gt;</text>
    </g>
  </g>

  <path class="ink-light" d="M730 268 Q 740 276 728 284" opacity="0.45"/>
</svg>
