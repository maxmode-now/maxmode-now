<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t">
  <title id="t">Character sheet - hand-inked</title>
  <defs>
    <style>
      <![CDATA[
        .paper { fill: #f2efe8; }
        .panel { fill: #f7f5f0; stroke: #2a2a2a; stroke-width: 1.3; stroke-linejoin: round; }
        .ink { fill: none; stroke: #2a2a2a; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
        .ink-soft { fill: none; stroke: #4a4a4a; stroke-width: 1.1; stroke-linecap: round; }
        .ink-light { fill: none; stroke: #6e6e6e; stroke-width: 0.9; stroke-linecap: round; }
        .label { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 13px; }
        .title { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 15px; font-weight: bold; }
        .muted { font-family: "Courier New", Courier, monospace; fill: #5a5a5a; font-size: 11px; }
        .body { font-family: "Courier New", Courier, monospace; fill: #2a2a2a; font-size: 12px; }
        .check { fill: #2a2a2a; stroke: none; }
        .box { fill: none; stroke: #2a2a2a; stroke-width: 1.3; }
      ]]>
    </style>
  </defs>

  <rect class="paper" x="6" y="6" width="708" height="348" rx="4"/>
  <path class="ink" d="M10 14 C 40 6, 680 6, 710 16 C 718 50, 716 320, 708 346 C 670 356, 50 356, 14 342 C 4 300, 4 50, 10 14 Z" fill="none"/>

  <!-- header -->
  <text class="title" x="360" y="40" text-anchor="middle">CHARACTER SHEET</text>
  <path class="ink-soft" d="M250 48 Q 360 54 470 48"/>
  <text class="muted" x="360" y="68" text-anchor="middle">NPC #0042  //  graphite-class developer</text>

  <!-- bio quote block -->
  <path class="panel" d="M40 84 H680 V148 H40 Z" fill="#f7f5f0"/>
  <path class="ink-light" d="M52 96 V136" opacity="0.5"/>
  <text class="body" x="64" y="106">I sketch interfaces, then convince electrons to behave.</text>
  <text class="body" x="64" y="124">Some days craftsman. Some days a bug's emotional support human.</text>
  <text class="muted" x="64" y="140">Either way - leave things a little better than found.</text>

  <!-- left panel: quests -->
  <g transform="translate(40, 168)">
    <path class="panel" d="M0 0 H310 V160 H0 Z"/>
    <text class="title" x="16" y="28">Active Quests</text>
    <path class="ink-light" d="M16 36 H180" opacity="0.45"/>

    <!-- checked -->
    <rect class="box" x="16" y="52" width="14" height="14" rx="1"/>
    <path class="ink" d="M19 59 L22 62 L28 54"/>
    <text class="body" x="40" y="64">Open the sketchbook</text>

    <!-- unchecked -->
    <rect class="box" x="16" y="78" width="14" height="14" rx="1"/>
    <text class="body" x="40" y="90">Draw something people remember</text>

    <rect class="box" x="16" y="104" width="14" height="14" rx="1"/>
    <text class="body" x="40" y="116">Ship it before the eraser wins</text>

    <rect class="box" x="16" y="130" width="14" height="14" rx="1"/>
    <text class="body" x="40" y="142">Collect stars like pocket lint</text>
  </g>

  <!-- right panel: inventory -->
  <g transform="translate(370, 168)">
    <path class="panel" d="M0 0 H310 V160 H0 Z"/>
    <text class="title" x="16" y="28">Inventory</text>
    <path class="ink-light" d="M16 36 H140" opacity="0.45"/>

    <text class="body" x="16" y="60">console.log</text>
    <text class="muted" x="150" y="60">reveals fog of war</text>
    <path class="ink-light" d="M16 68 H294" opacity="0.25"/>

    <text class="body" x="16" y="88">Soft eraser</text>
    <text class="muted" x="150" y="88">undoes hubris</text>
    <path class="ink-light" d="M16 96 H294" opacity="0.25"/>

    <text class="body" x="16" y="116">Second coffee</text>
    <text class="muted" x="150" y="116">+2 focus / -1 sleep</text>
    <path class="ink-light" d="M16 124 H294" opacity="0.25"/>

    <text class="body" x="16" y="144">Sticky note</text>
    <text class="muted" x="150" y="144">external brain slot</text>
  </g>

  <!-- corner doodles -->
  <path class="ink-light" d="M670 330 Q 680 340 668 348" opacity="0.45"/>
  <path class="ink-soft" d="M34 330 L48 330 M36 334 L46 334" opacity="0.5"/>
</svg>
